
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GiriShorts</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif}
header{height:54px;padding:14px 16px;background:#151515;font-size:23px;font-weight:bold}
header span{color:#ff3158}
.search{padding:9px 12px;background:#151515}
.search input{width:100%;padding:12px 15px;border:0;border-radius:24px;background:#292929;color:white;font-size:15px}
main{height:calc(100dvh - 158px);overflow-y:auto;scroll-snap-type:y mandatory}
.post{height:calc(100dvh - 158px);position:relative;scroll-snap-align:start;background:#000;overflow:hidden}
video{width:100%;height:100%;object-fit:contain;background:#000}
.caption{position:absolute;bottom:20px;left:14px;right:78px;text-shadow:0 1px 5px #000;pointer-events:none}
.caption p{font-size:14px;overflow-wrap:anywhere}
.actions{position:absolute;right:9px;bottom:65px;display:grid;gap:12px}
.actions button{background:#292929;color:white;border:0;border-radius:25px;padding:12px 8px;font-size:13px}
nav{height:50px;position:fixed;bottom:0;left:0;right:0;background:#151515;display:flex;justify-content:space-around;align-items:center;font-size:11px;z-index:5}
nav button{background:none;border:0;color:white;font-size:11px;padding:8px 5px}
#uploadFile{display:none}
#empty{display:none;text-align:center;padding:25px;color:#bbb}
</style>
</head>
<body>

<header>Giri<span>Shorts</span></header>

<div class="search">
<input id="search" type="search" placeholder="🔍 Cari video atau kreator...">
</div>

<main id="feed">

<section class="post" data-search="video pertama girishorts kreator">
<video controls playsinline loop preload="metadata">
<source src="https://mahrudin1999-netizen.github.io/Girishorts/1793074906225.mp4" type="video/mp4">
</video>
<div class="caption">
<strong>@GiriShorts</strong>
<p>Video pertama di GiriShorts 🎬</p>
</div>
<div class="actions">
<button onclick="likeVideo(this)">♡ Suka</button>
<button onclick="sharePage()">↗ Bagikan</button>
</div>
</section>

<section class="post" data-search="video kedua girishorts kreator">
<video controls playsinline loop preload="metadata">
<source src="https://mahrudin1999-netizen.github.io/Girishorts/1793074558310.mp4" type="video/mp4">
</video>
<div class="caption">
<strong>@GiriShorts</strong>
<p>Video kedua di GiriShorts 🔥</p>
</div>
<div class="actions">
<button onclick="likeVideo(this)">♡ Suka</button>
<button onclick="sharePage()">↗ Bagikan</button>
</div>
</section>

</main>

<div id="empty">Video tidak ditemukan.</div>

<input id="uploadFile" type="file" accept="video/*">

<nav>
<button onclick="resetSearch()">⌂ Beranda</button>
<button onclick="openSearch()">⌕ Cari</button>
<button onclick="openUpload()">＋ Unggah</button>
<button onclick="showLikes()">♡ Suka</button>
<button onclick="showProfile()">♙ Profil</button>
</nav>

<script>
const feed=document.getElementById('feed');
const search=document.getElementById('search');
const uploadFile=document.getElementById('uploadFile');
const empty=document.getElementById('empty');

function searchVideos(){
const q=search.value.toLowerCase().trim();
let count=0;

document.querySelectorAll('.post').forEach(post=>{
const matched=(post.dataset.search||'').includes(q);
post.style.display=matched?'block':'none';

if(!matched){
const video=post.querySelector('video');
if(video)video.pause();
}else{
count++;
}
});

empty.style.display=count?'none':'block';
}

search.addEventListener('input',searchVideos);

function resetSearch(){
search.value='';
searchVideos();
feed.scrollTop=0;
document.querySelectorAll('video').forEach(v=>v.pause());
}

function openSearch(){
search.focus();
window.scrollTo(0,0);
}

function openUpload(){
uploadFile.click();
}

uploadFile.addEventListener('change',function(){
const file=this.files&&this.files[0];
if(!file)return;

if(!file.type.startsWith('video/')){
alert('Silakan pilih file video.');
this.value='';
return;
}

const url=URL.createObjectURL(file);
const post=document.createElement('section');
post.className='post';
post.dataset.search=(file.name+' video kreator girishorts').toLowerCase();

const video=document.createElement('video');
video.controls=true;
video.playsInline=true;
video.loop=true;
video.preload='metadata';
video.src=url;

const caption=document.createElement('div');
caption.className='caption';

const creator=document.createElement('strong');
creator.textContent='@GiriShorts';

const description=document.createElement('p');
description.textContent=file.name;

caption.append(creator,description);

const actions=document.createElement('div');
actions.className='actions';

const like=document.createElement('button');
like.textContent='♡ Suka';
like.onclick=function(){likeVideo(this)};

const share=document.createElement('button');
share.textContent='↗ Bagikan';
share.onclick=sharePage;

actions.append(like,share);
post.append(video,caption,actions);
feed.prepend(post);

search.value='';
searchVideos();
post.scrollIntoView({behavior:'smooth'});
video.play().catch(()=>{});

this.value='';
});

function likeVideo(button){
const liked=button.dataset.liked==='yes';
button.dataset.liked=liked?'no':'yes';
button.textContent=liked?'♡ Suka':'♥ Disukai';
}

async function sharePage(){
try{
if(navigator.share){
await navigator.share({title:'GiriShorts',url:location.href});
}else if(navigator.clipboard){
await navigator.clipboard.writeText(location.href);
alert('Tautan GiriShorts disalin.');
}else{
prompt('Salin tautan GiriShorts:',location.href);
}
}catch(e){}
}

function showLikes(){
alert('Fitur daftar video yang disukai akan kita kembangkan berikutnya.');
}

function showProfile(){
alert('Profil kreator akan kita kembangkan berikutnya.');
}

const observer=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
const video=entry.target;
if(entry.isIntersecting&&entry.intersectionRatio>=0.6){
video.play().catch(()=>{});
}else{
video.pause();
}
});
},{threshold:[0,0.6,1]});

function observeVideos(){
document.querySelectorAll('.post video').forEach(video=>{
if(!video.dataset.observed){
observer.observe(video);
video.dataset.observed='yes';
}
});
}

const mutationObserver=new MutationObserver(observeVideos);
mutationObserver.observe(feed,{childList:true,subtree:true});
observeVideos();
</script>
</body>
</html>
