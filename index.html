
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GiriShorts</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif}
header{padding:14px 16px;background:#151515;font-size:23px;font-weight:bold}
header span{color:#ff3158}
.search{padding:9px 12px;background:#151515}
.search input{width:100%;padding:12px 15px;border:0;border-radius:24px;background:#292929;color:white;font-size:15px}
main{height:calc(100dvh - 158px);overflow-y:auto;scroll-snap-type:y mandatory}
.post{height:calc(100dvh - 158px);position:relative;scroll-snap-align:start;background:#000;overflow:hidden}
video{width:100%;height:100%;object-fit:contain;background:#000}
.caption{position:absolute;bottom:20px;left:14px;right:80px;text-shadow:0 1px 5px #000;pointer-events:none}
.caption p{font-size:14px;overflow-wrap:anywhere}
.actions{position:absolute;right:8px;bottom:55px;display:grid;gap:9px}
.actions button{background:#292929;color:white;border:0;border-radius:25px;padding:11px 7px;font-size:12px}
nav{height:50px;position:fixed;bottom:0;left:0;right:0;background:#151515;display:flex;justify-content:space-around;align-items:center;font-size:11px;z-index:5}
nav button{background:none;border:0;color:white;font-size:11px;padding:8px 5px}
#uploadFile{display:none}
#empty{display:none;text-align:center;padding:25px;color:#bbb}
#commentLayer{display:none;position:fixed;inset:0;background:#0009;z-index:20;align-items:flex-end}
#commentPanel{width:100%;max-height:72%;background:#171717;border-radius:18px 18px 0 0;padding:16px;display:flex;flex-direction:column}
#commentHeader{display:flex;justify-content:space-between;align-items:center;font-weight:bold}
#commentList{overflow-y:auto;min-height:90px;max-height:40vh;padding:10px 0}
.comment{padding:9px 0;border-bottom:1px solid #333;overflow-wrap:anywhere}
.comment small{display:block;color:#aaa;margin-top:4px}
#commentForm{display:flex;gap:8px;padding-bottom:12px}
#commentInput{flex:1;min-width:0;padding:12px;border:0;border-radius:22px;background:#303030;color:white}
#commentForm button{border:0;border-radius:22px;padding:0 16px;background:#ff3158;color:white}
</style>
</head>
<body>
<header>Giri<span>Shorts</span></header>
<div class="search">
<input id="search" type="search" placeholder="🔍 Cari video atau kreator...">
</div>

<main id="feed">
<section class="post" data-id="video1" data-search="video pertama girishorts kreator">
<video controls playsinline loop preload="metadata">
<source src="https://mahrudin1999-netizen.github.io/Girishorts/1793074906225.mp4" type="video/mp4">
</video>
<div class="caption"><strong>@GiriShorts</strong><p>Video pertama di GiriShorts 🎬</p></div>
<div class="actions">
<button class="like" onclick="likeVideo(this)">♡ Suka</button>
<button onclick="openComments(this)">💬 Komentar</button>
<button onclick="sharePage()">↗ Bagikan</button>
</div>
</section>

<section class="post" data-id="video2" data-search="video kedua girishorts kreator">
<video controls playsinline loop preload="metadata">
<source src="https://mahrudin1999-netizen.github.io/Girishorts/1793074558310.mp4" type="video/mp4">
</video>
<div class="caption"><strong>@GiriShorts</strong><p>Video kedua di GiriShorts 🔥</p></div>
<div class="actions">
<button class="like" onclick="likeVideo(this)">♡ Suka</button>
<button onclick="openComments(this)">💬 Komentar</button>
<button onclick="sharePage()">↗ Bagikan</button>
</div>
</section>
</main>

<div id="empty">Video tidak ditemukan.</div>
<input id="uploadFile" type="file" accept="video/*">

<div id="commentLayer">
<div id="commentPanel">
<div id="commentHeader">
<span>Komentar 💬</span>
<button onclick="closeComments()" style="background:#333;color:white;border:0;border-radius:20px;padding:8px 12px">Tutup ✕</button>
</div>
<div id="commentList"></div>
<form id="commentForm">
<input id="commentInput" maxlength="500" placeholder="Tulis komentar..." required>
<button type="submit">Kirim</button>
</form>
</div>
</div>

<nav>
<button onclick="showHome()">⌂ Beranda</button>
<button onclick="openSearch()">⌕ Cari</button>
<button onclick="openUpload()">＋ Unggah</button>
<button onclick="showLikes()">♥ Suka</button>
<button onclick="showProfile()">♙ Profil</button>
</nav>

<script>
const feed=document.getElementById('feed');
const search=document.getElementById('search');
const uploadFile=document.getElementById('uploadFile');
const empty=document.getElementById('empty');
const commentLayer=document.getElementById('commentLayer');
const commentList=document.getElementById('commentList');
const commentInput=document.getElementById('commentInput');
let activePost=null;

function getStored(key,fallback=[]){
try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback))}
catch(e){return fallback}
}
function saveStored(key,value){
try{localStorage.setItem(key,JSON.stringify(value));return true}
catch(e){alert('Penyimpanan browser penuh atau tidak tersedia.');return false}
}

function getLikes(){return getStored('girishorts_likes',[])}

function refreshLikeButtons(){
const likes=getLikes();
document.querySelectorAll('.post').forEach(post=>{
const button=post.querySelector('.like');
if(!button)return;
const liked=likes.includes(post.dataset.id);
button.dataset.liked=liked?'yes':'no';
button.textContent=liked?'♥ Disukai':'♡ Suka';
});
}

function likeVideo(button){
const id=button.closest('.post').dataset.id;
let likes=getLikes();
likes=likes.includes(id)?likes.filter(x=>x!==id):[...likes,id];
if(saveStored('girishorts_likes',likes))refreshLikeButtons();
if(document.body.dataset.page==='likes')filterVideos();
}

function filterVideos(){
const q=search.value.toLowerCase().trim();
const likes=getLikes();
let count=0;
document.querySelectorAll('#feed .post').forEach(post=>{
const text=((post.dataset.search||'')+' '+(post.querySelector('.caption')?.innerText||'')).toLowerCase();
const visible=text.includes(q)&&(document.body.dataset.page!=='likes'||likes.includes(post.dataset.id));
post.style.display=visible?'':'none';
if(!visible)post.querySelector('video').pause();
if(visible)count++;
});
empty.style.display=count?'none':'block';
}

search.addEventListener('input',filterVideos);

function showHome(){
document.body.dataset.page='home';
search.value='';
search.placeholder='🔍 Cari video atau kreator...';
filterVideos();
feed.scrollTop=0;
}
function showLikes(){
document.body.dataset.page='likes';
search.value='';
search.placeholder='🔍 Cari video yang disukai...';
filterVideos();
feed.scrollTop=0;
}
function openSearch(){search.focus();window.scrollTo(0,0)}
function openUpload(){uploadFile.click()}

uploadFile.addEventListener('change',function(){
const file=this.files&&this.files[0];
if(!file)return;
if(!file.type.startsWith('video/')){alert('Pilih file video.');this.value='';return}

const url=URL.createObjectURL(file);
const post=document.createElement('section');
post.className='post';
post.dataset.id='local_'+Date.now();
post.dataset.search=(file.name+' video kreator girishorts').toLowerCase();

const video=document.createElement('video');
video.controls=true;video.playsInline=true;video.loop=true;video.preload='metadata';video.src=url;

const caption=document.createElement('div');
caption.className='caption';
const creator=document.createElement('strong');
creator.textContent='@GiriShorts';
const desc=document.createElement('p');
desc.textContent=file.name;
caption.append(creator,desc);

const actions=document.createElement('div');
actions.className='actions';
const like=document.createElement('button');
like.className='like';like.textContent='♡ Suka';like.onclick=function(){likeVideo(this)};
const comment=document.createElement('button');
comment.textContent='💬 Komentar';comment.onclick=function(){openComments(this)};
const share=document.createElement('button');
share.textContent='↗ Bagikan';share.onclick=sharePage;
actions.append(like,comment,share);
post.append(video,caption,actions);
feed.prepend(post);
document.body.dataset.page='home';
search.value='';
filterVideos();
post.scrollIntoView({behavior:'smooth'});
video.play().catch(()=>{});
this.value='';
});

function getComments(){
const all=getStored('girishorts_comments',{});
return all;
}
function openComments(button){
activePost=button.closest('.post');
renderComments();
commentLayer.style.display='flex';
document.querySelectorAll('#feed video').forEach(v=>v.pause());
}
function closeComments(){
commentLayer.style.display='none';
activePost=null;
}
function renderComments(){
commentList.replaceChildren();
if(!activePost)return;
const all=getComments();
const comments=all[activePost.dataset.id]||[];
if(!comments.length){
const p=document.createElement('p');
p.style.color='#aaa';
p.textContent='Belum ada komentar. Jadilah yang pertama!';
commentList.appendChild(p);
return;
}
comments.forEach(item=>{
const div=document.createElement('div');
div.className='comment';
const name=document.createElement('strong');
name.textContent='@Pengguna';
const text=document.createElement('div');
text.textContent=item.text;
const time=document.createElement('small');
time.textContent=item.time;
div.append(name,text,time);
commentList.appendChild(div);
});
}
document.getElementById('commentForm').addEventListener('submit',function(event){
event.preventDefault();
if(!activePost)return;
const text=commentInput.value.trim();
if(!text)return;
const all=getComments();
const id=activePost.dataset.id;
if(!all[id])all[id]=[];
all[id].push({text:text,time:new Date().toLocaleString('id-ID')});
if(saveStored('girishorts_comments',all)){
commentInput.value='';
renderComments();
}
});
commentLayer.addEventListener('click',function(event){
if(event.target===commentLayer)closeComments();
});

async function sharePage(){
try{
if(navigator.share)await navigator.share({title:'GiriShorts',url:location.href});
else prompt('Salin tautan GiriShorts:',location.href);
}catch(e){}
}
function showProfile(){
alert('PROFIL KREATOR\n\nNama: @GiriShorts\nTotal video: '+document.querySelectorAll('#feed .post').length+'\nVideo disukai: '+getLikes().length);
}

const observer=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
const video=entry.target;
if(entry.isIntersecting&&entry.intersectionRatio>=0.6&&commentLayer.style.display!=='flex'){
if(document.body.dataset.page!=='likes'||getLikes().includes(video.closest('.post').dataset.id))video.play().catch(()=>{});
}else video.pause();
});
},{threshold:[0,0.6,1]});

function observeVideos(){
document.querySelectorAll('#feed .post video').forEach(video=>{
if(!video.dataset.observed){observer.observe(video);video.dataset.observed='yes'}
});
}
new MutationObserver(observeVideos).observe(feed,{childList:true,subtree:true});
document.body.dataset.page='home';
observeVideos();
refreshLikeButtons();
</script>
</body>
</html>
