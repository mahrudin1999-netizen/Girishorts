
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>Paket Data - GIRINATAN</title>

  <style>
    :root {
      --bg: #080808;
      --panel: #151515;
      --gold: #D6AD48;
      --green: #00C875;
      --text: #FFFFFF;
      --muted: #A8ADA8;
      --border: #343434;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    header {
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      color: var(--gold);
      font-size: 20px;
      font-weight: bold;
    }

    .brand span {
      color: white;
    }

    a {
      text-decoration: none;
    }

    .back {
      color: var(--green);
      font-size: 14px;
    }

    main {
      max-width: 650px;
      margin: auto;
      padding: 22px 16px 50px;
    }

    h1 {
      color: var(--gold);
      font-size: 24px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 23px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    input, select {
      width: 100%;
      padding: 15px;
      background: var(--panel);
      color: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    input:focus, select:focus {
      border-color: var(--gold);
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .product {
      padding: 16px 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: left;
      color: white;
      cursor: pointer;
    }

    .product.active {
      background: #10251A;
      border-color: var(--green);
    }

    .product h3 {
      color: var(--gold);
      font-size: 16px;
      margin-bottom: 8px;
    }

    .product p {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .summary {
      margin-top: 25px;
      padding: 17px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .summary h3 {
      color: var(--gold);
      margin-bottom: 13px;
    }

    .summary p {
      color: var(--muted);
      font-size: 13px;
      margin: 9px 0;
    }

    .continue {
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #E5C36A, #B88A2E);
      color: #080808;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    .notice {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
      margin-top: 18px;
    }
  </style>
</head>

<body>

<header>
  <div class="brand">GIRI<span>NATAN</span></div>
  <a class="back" href="index.html">← Market</a>
</header>

<main>

  <h1>Paket Data Internet</h1>
  <p class="subtitle">
    Pilih operator dan paket internet sesuai kebutuhanmu.
  </p>

  <div class="form-group">
    <label for="phone">Nomor HP Tujuan</label>
    <input
      type="tel"
      id="phone"
      placeholder="Masukkan nomor HP"
      maxlength="15"
      inputmode="numeric">
  </div>

  <div class="form-group">
    <label for="operator">Pilih Operator</label>
    <select id="operator">
      <option value="">-- Pilih Operator --</option>
      <option value="Telkomsel">Telkomsel</option>
      <option value="Indosat">Indosat</option>
      <option value="XL">XL</option>
      <option value="Axis">Axis</option>
      <option value="Tri">Tri</option>
      <option value="Smartfren">Smartfren</option>
    </select>
  </div>

  <div class="form-group">
    <label>Pilih Paket Data</label>

    <div class="products">

      <button class="product" data-name="Paket 1 GB">
        <h3>1 GB</h3>
        <p>Paket internet</p>
      </button>

      <button class="product" data-name="Paket 3 GB">
        <h3>3 GB</h3>
        <p>Paket internet</p>
      </button>

      <button class="product" data-name="Paket 5 GB">
        <h3>5 GB</h3>
        <p>Paket internet</p>
      </button>

      <button class="product" data-name="Paket 10 GB">
        <h3>10 GB</h3>
        <p>Paket internet</p>
      </button>

      <button class="product" data-name="Paket 15 GB">
        <h3>15 GB</h3>
        <p>Paket internet</p>
      </button>

      <button class="product" data-name="Paket 20 GB">
        <h3>20 GB</h3>
        <p>Paket internet</p>
      </button>

    </div>
  </div>

  <section class="summary">
    <h3>Ringkasan Pesanan</h3>
    <p>Nomor HP: <span id="summaryPhone">-</span></p>
    <p>Operator: <span id="summaryOperator">-</span></p>
    <p>Paket: <span id="summaryPackage">-</span></p>

    <button class="continue" onclick="continueOrder()">
      Lanjutkan
    </button>
  </section>

  <p class="notice">
    Daftar paket di atas hanya contoh tampilan.
    Produk, kuota, masa aktif, dan harga resmi akan
    dimuat dari supplier setelah integrasi API selesai.
  </p>

</main>

<script>
  let selectedPackage = "";

  const phone = document.getElementById("phone");
  const operator = document.getElementById("operator");

  phone.addEventListener("input", () => {
    document.getElementById("summaryPhone").textContent =
      phone.value || "-";
  });

  operator.addEventListener("change", () => {
    document.getElementById("summaryOperator").textContent =
      operator.value || "-";

    selectedPackage = "";
    document.getElementById("summaryPackage").textContent = "-";

    document.querySelectorAll(".product").forEach(item => {
      item.classList.remove("active");
    });
  });

  document.querySelectorAll(".product").forEach(button => {
    button.addEventListener("click", () => {
      if (!operator.value) {
        alert("Pilih operator terlebih dahulu.");
        return;
      }

      document.querySelectorAll(".product").forEach(item => {
        item.classList.remove("active");
      });

      button.classList.add("active");
      selectedPackage = button.dataset.name;

      document.getElementById("summaryPackage").textContent =
        selectedPackage;
    });
  });

  function continueOrder() {
    if (!/^[0-9]{9,15}$/.test(phone.value.trim())) {
      alert("Masukkan nomor HP yang valid.");
      return;
    }

    if (!operator.value) {
      alert("Pilih operator terlebih dahulu.");
      return;
    }

    if (!selectedPackage) {
      alert("Pilih paket data terlebih dahulu.");
      return;
    }

    alert(
      "Pilihan paket sudah tercatat. " +
      "Transaksi belum aktif karena supplier belum terhubung."
    );
  }
</script>

</body>
</html>
